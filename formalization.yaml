# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "NUSLean"
  description: >-
    A Lean 4 and Mathlib proof that there are absolute constants c > 0 and
    p₀ such that, for every prime p ≥ p₀, the minimum size m(p) of a set
    A ⊆ 𝔽_p with |A| ≥ 2 and no uniquely represented sum satisfies
    m(p) ≥ c (log p / log log p)².  Here representations are unordered
    two-element multisets from A, repeated summands are allowed, and "no
    unique sum" means that every such multiset has a distinct equal-sum mate.
  authors:
    - "Xinjie"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xinjie"

classification:
  arxiv: [math.CO, math.NT]
  msc2020: [11B30, 11B34]

sources:
  - title: "A near-quadratic lower bound for sets with no unique sums"
    authors:
      - "Xinjie"
    id: "NUS_edited.tex at the submitted repository commit"
    type: "paper"
    location: "NUS_edited.tex"
    relationship: "formalizes"
    note: >-
      The Lean development formalizes the lower-bound theorem and its proof
      from this working draft.  The draft is included in the repository so
      that the informal and formal arguments can be reviewed together.
    author_endorsement: "participated"
  - title: "On unique sums in Abelian groups"
    authors:
      - "Benjamin Bedert"
    id: "https://doi.org/10.1007/s00493-023-00069-w"
    type: "paper"
    location: "https://doi.org/10.1007/s00493-023-00069-w"
    relationship: "background"
    note: >-
      Background for the problem, the previously known lower bound, and the
      upper-bound construction cited in the paper.  The upper bound is not
      re-formalized here.
    author_endorsement: "not-contacted"
  - title: "100 open problems, Problem 27"
    authors:
      - "Ben Green"
    id: "https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf"
    type: "paper"
    location: "https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf"
    relationship: "background"
    note: "The source of the open problem studied by the project."
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The compared declaration NUS.m_lower_bound says exactly that there exist
    a real constant c with 0 < c and a natural-number threshold p₀ such that,
    for every natural number p, if p is prime and p₀ ≤ p, then
    c * (Real.log p / Real.log (Real.log p))^2 ≤ m p.  Natural numbers are
    coerced to reals in this inequality.  The definition m p is the infimum
    in ℕ of cardinalities k for which there is a finite A ⊆ ZMod p with
    A.card = k, 2 ≤ k, and no unique sum.  The project also proves the
    stronger setwise statement for every such A and formalizes all
    intermediate collision-lattice, clean-rectangle, common-cut,
    contraction, compression, determinant, and numerical-reduction
    arguments.  It does not formalize Bedert's external O((log p)^2) upper
    bound, so it proves the lower bound but not the full asymptotic equality
    m(p) = (log p)^(2+o(1)) without using that cited result.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
