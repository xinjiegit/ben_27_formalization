    The work combined human mathematical direction with AI-assisted proof
    engineering.  Lean's kernel checks the final proof; AI review is not a
    substitute for independent mathematical peer review.

fidelity:
  divergences: >-
    No divergence is known in the lower-bound theorem.  ZMod p represents the
    prime field 𝔽_p.  Real.log is the natural logarithm; changing the logarithm
    base only changes the absolute constant.  The formal definition uses the
    paper's stated equivalent multiset formulation: every unordered
    two-element multiset from A has a different unordered multiset from A
    with the same sum, and a repeated pair {a,a} is allowed.  The existential
    phrase "sufficiently large" is represented by ∃ p₀ and the proof can take
    p₀ = 64.  The definition uses Nat.sInf, but the development proves that
    the defining set is nonempty and the infimum is attained for odd primes.
    Bedert's external upper bound is cited rather than formalized, so the full
    asymptotic equality in the paper's corollary is outside the proved scope.

review:
  status: "self-assessed and agent-reviewed"
  reviewers:
    - "Xinjie"
    - "OpenAI Codex"
  notes: >-
    The repository has been built with the pinned Lean toolchain, searched for
    proof holes and prohibited proof mechanisms, and checked with #print
    axioms on both headline declarations.  No independent human peer review
    of the complete Lean development is claimed.

alignment:
  namespace: "NUS"
  statements:
    - source: "Theorem 1.2"
      lean: "NUS.m_lower_bound"
      module: "NUSLean.Main"
      status: "proved"
      note: >-
        This is the headline lower bound for m(p), with the same quantifiers,
        prime-field setting, repeated-summand convention, and asymptotic
        expression as Theorem 1.2.  It is the sole declaration recorded in
        comparator.json.
    - source: "Theorem 1.2, setwise form used in the proof"
      lean: "NUS.main_lower_bound"
      module: "NUSLean.Main"
      status: "proved"
      note: >-
        This strengthens the minimum-cardinality statement to every finite set
        with no unique sum and is used to derive NUS.m_lower_bound.

acknowledgements: >-
  Built with Lean 4 and Mathlib.  The project uses results and problem context
  due to Benjamin Bedert and Ben Green, as cited above.
